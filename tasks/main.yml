---
- name: common | Fail if distro is not supported
  ansible.builtin.fail:
    msg: "Distribution '{{ ansible_facts['distribution'] }}' is not supported. Supported: Debian, Ubuntu"
  when: ansible_facts['distribution'] not in ['Debian', 'Ubuntu']

- name: common | Set hostname
  ansible.builtin.hostname:
    name: "{{ common_hostname }}"

- name: common | Deploy /etc/hosts
  ansible.builtin.template:
    src: hosts.j2
    dest: /etc/hosts
    owner: root
    group: root
    mode: "0644"

- name: common | Set timezone
  ansible.builtin.timezone:
    name: "{{ common_timezone }}"

- name: common | Ensure locales package is installed
  ansible.builtin.apt:
    name: locales
    state: present
    update_cache: true

- name: common | Set locale
  ansible.builtin.locale_gen:
    name: "{{ common_locale }}"
    state: present

- name: common | Set default locale
  ansible.builtin.copy:
    content: |
      LANG={{ common_locale }}
      LC_ALL={{ common_locale }}
    dest: /etc/default/locale
    owner: root
    group: root
    mode: "0644"

- name: common | Deploy profile.d scripts
  ansible.builtin.copy:
    src: profile.d/
    dest: /etc/profile.d/
    owner: root
    group: root
    mode: "0644"
  when: common_profile_d | bool

- name: common | Backup original pam.d/sshd
  ansible.builtin.copy:
    src: /etc/pam.d/sshd
    dest: /etc/pam.d/sshd.orig
    remote_src: true
    owner: root
    group: root
    mode: "0644"
    force: false
  when: common_pam_sshd | bool

- name: common | Deploy custom pam.d/sshd
  ansible.builtin.copy:
    src: pam.d/sshd
    dest: /etc/pam.d/sshd
    owner: root
    group: root
    mode: "0644"
  when: common_pam_sshd | bool

- name: common | Load kernel modules and persist them across reboots
  community.general.modprobe:
    name: "{{ item }}"
    state: present
    persistent: present
  loop: "{{ common_modules_load }}"
  when: common_modules_load | length > 0

- name: common | Migrate managed sysctl keys out of /etc/sysctl.conf
  ansible.builtin.lineinfile:
    path: /etc/sysctl.conf
    regexp: "^[ \t]*{{ item.key | regex_escape }}[ \t]*="
    state: absent
  loop: "{{ common_sysctl | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: common_sysctl | length > 0
  notify: Reload sysctl

- name: common | Deploy managed sysctl file
  ansible.builtin.template:
    src: sysctl.conf.j2
    dest: "{{ common_sysctl_file }}"
    owner: root
    group: root
    mode: "0644"
  when: common_sysctl | length > 0
  notify: Reload sysctl

- name: common | Remove managed sysctl file when no settings are defined
  ansible.builtin.file:
    path: "{{ common_sysctl_file }}"
    state: absent
  when: common_sysctl | length == 0
  notify: Reload sysctl
